name: lingotrip

services:
  api:
    profiles: ["app"]
    build:
      context: .
    command: ["sh", "-c", "node dist/cli/migrate.js && exec node dist/server.js"]
    depends_on:
      mailpit:
        condition: service_healthy
      minio-init:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AI_USER_MINUTE_LIMIT: 30
      AUTH_ACTION_URL_BASE: http://127.0.0.1:8080/auth
      AUTH_ISSUER: http://127.0.0.1:8080
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: postgres://lingotrip:lingotrip_dev@postgres:5432/lingotrip
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      HOST: 0.0.0.0
      JOB_PAYLOAD_ENCRYPTION_KEY_BASE64: ${JOB_PAYLOAD_ENCRYPTION_KEY_BASE64:-}
      JOB_PAYLOAD_KEY_VERSION: ${JOB_PAYLOAD_KEY_VERSION:-}
      JOB_PAYLOAD_PREVIOUS_KEYS: ${JOB_PAYLOAD_PREVIOUS_KEYS:-}
      LOG_LEVEL: debug
      MEDIA_S3_ACCESS_KEY_ID: lingotrip_dev
      MEDIA_S3_BUCKET: lingotrip-media-dev
      MEDIA_S3_ENDPOINT: http://minio:9000
      MEDIA_S3_FORCE_PATH_STYLE: "true"
      MEDIA_S3_REGION: us-east-1
      MEDIA_S3_SECRET_ACCESS_KEY: lingotrip_dev_only
      MEDIA_STORAGE_ENABLED: "true"
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  worker:
    profiles: ["app"]
    build:
      context: .
    command: ["node", "dist/worker.js"]
    depends_on:
      mailpit:
        condition: service_healthy
      minio-init:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      AUTH_ACTION_URL_BASE: http://127.0.0.1:8080/auth
      DATABASE_URL: postgres://lingotrip:lingotrip_dev@postgres:5432/lingotrip
      JOB_PAYLOAD_ENCRYPTION_KEY_BASE64: ${JOB_PAYLOAD_ENCRYPTION_KEY_BASE64:-}
      JOB_PAYLOAD_KEY_VERSION: ${JOB_PAYLOAD_KEY_VERSION:-}
      JOB_PAYLOAD_PREVIOUS_KEYS: ${JOB_PAYLOAD_PREVIOUS_KEYS:-}
      LOG_LEVEL: debug
      MEDIA_S3_ACCESS_KEY_ID: lingotrip_dev
      MEDIA_S3_BUCKET: lingotrip-media-dev
      MEDIA_S3_ENDPOINT: http://minio:9000
      MEDIA_S3_FORCE_PATH_STYLE: "true"
      MEDIA_S3_REGION: us-east-1
      MEDIA_S3_SECRET_ACCESS_KEY: lingotrip_dev_only
      MEDIA_STORAGE_ENABLED: "true"
      NODE_ENV: development
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    healthcheck:
      disable: true
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_PASSWORD: lingotrip_dev_only
      MINIO_ROOT_USER: lingotrip_dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    restart: unless-stopped
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 lingotrip_dev lingotrip_dev_only && mc mb
        --ignore-existing local/lingotrip-media-dev && mc anonymous set none
        local/lingotrip-media-dev && while true; do sleep 3600; done
    healthcheck:
      test: ["CMD", "mc", "stat", "local/lingotrip-media-dev"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lingotrip
      POSTGRES_PASSWORD: lingotrip_dev
      POSTGRES_USER: lingotrip
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lingotrip -d lingotrip"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "127.0.0.1:54329:5432"
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "127.0.0.1:63799:6379"
    restart: unless-stopped

volumes:
  minio-data:
  postgres-data:
