name: lingotrip-production

x-app: &app
  image: lingotrip-backend:${APP_VERSION}
  env_file:
    - ${ENVIRONMENT_FILE:-.env.production}
  environment: &app-environment
    DATABASE_URL: postgres://lingotrip_runtime:${RUNTIME_DB_PASSWORD}@postgres:5432/lingotrip
    HOST: 0.0.0.0
    MEDIA_S3_ENDPOINT: https://${PUBLIC_HOST}
    NODE_ENV: production
    PORT: 8080
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    SMTP_HOST: ${SMTP_HOST:-mailpit}
    SMTP_PORT: ${SMTP_PORT:-1025}
    SMTP_SECURE: ${SMTP_SECURE:-false}
    TRUST_PROXY: "true"
  init: true
  networks:
    - private
  read_only: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=32m,mode=1777
  logging:
    driver: json-file
    options:
      max-file: "5"
      max-size: 10m

services:
  api:
    <<: *app
    build:
      args:
        DISTROLESS_REGISTRY: ${DISTROLESS_REGISTRY:-gcr.io}
      context: .
    cap_drop:
      - ALL
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD",
          "/nodejs/bin/node",
          "-e",
          "fetch('http://127.0.0.1:8080/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s
    mem_limit: 320m
    pids_limit: 200

  worker:
    <<: *app
    cap_drop:
      - ALL
    command:
      [
        "--import",
        "./dist/instrumentation-loader.js",
        "--import",
        "./dist/instrumentation.js",
        "dist/worker.js",
      ]
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    mem_limit: 256m
    pids_limit: 160

  caddy:
    image: caddy:2.10.2-alpine
    cap_add:
      - NET_BIND_SERVICE
    cap_drop:
      - ALL
    depends_on:
      api:
        condition: service_started
    environment:
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-lingotrip-media}
      PUBLIC_HOST: ${PUBLIC_HOST}
    networks:
      private:
        aliases:
          - ${PUBLIC_HOST}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - ./ops/single-server/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-config:/config
      - caddy-data:/data
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    mem_limit: 128m
    pids_limit: 100

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lingotrip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: lingotrip_migrator
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lingotrip_migrator -d lingotrip"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - private
    restart: unless-stopped
    shm_size: 128m
    volumes:
      - postgres-data:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    mem_limit: 384m
    pids_limit: 160

  redis:
    image: redis:8-alpine
    command:
      [
        "sh",
        "-c",
        'exec redis-server --appendonly yes --appendfsync everysec --save 900 1
        --requirepass "$${REDIS_PASSWORD}"',
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - private
    restart: unless-stopped
    volumes:
      - redis-data:/data
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    mem_limit: 128m
    pids_limit: 100

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_PASSWORD: ${MEDIA_S3_SECRET_ACCESS_KEY}
      MINIO_ROOT_USER: ${MEDIA_S3_ACCESS_KEY_ID}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - private
    restart: unless-stopped
    volumes:
      - minio-data:/data
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    mem_limit: 320m
    pids_limit: 160

  mailpit:
    image: axllent/mailpit:v1.27
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - private
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 5m
    mem_limit: 128m
    pids_limit: 100

  migrate:
    image: lingotrip-backend:${APP_VERSION}
    profiles: ["tools"]
    command: ["dist/cli/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MIGRATION_DATABASE_URL: postgres://lingotrip_migrator:${POSTGRES_PASSWORD}@postgres:5432/lingotrip
      NODE_ENV: production
    networks:
      - private
    read_only: true
    security_opt:
      - no-new-privileges:true

  database-permissions:
    image: postgres:17-alpine
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGDATABASE: lingotrip
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGUSER: lingotrip_migrator
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD}
    entrypoint: ["/bin/sh", "/opt/lingotrip/apply-database-permissions.sh"]
    networks:
      - private
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./ops/single-server/apply-database-permissions.sh:/opt/lingotrip/apply-database-permissions.sh:ro

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles: ["tools"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}"
        "$${MINIO_ROOT_PASSWORD}" && mc mb --ignore-existing "local/$${MEDIA_S3_BUCKET}"
        && mc anonymous set none "local/$${MEDIA_S3_BUCKET}" && mc version enable
        "local/$${MEDIA_S3_BUCKET}"
    environment:
      MC_CONFIG_DIR: /tmp/.mc
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-lingotrip-media}
      MINIO_ROOT_PASSWORD: ${MEDIA_S3_SECRET_ACCESS_KEY}
      MINIO_ROOT_USER: ${MEDIA_S3_ACCESS_KEY_ID}
    networks:
      - private
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=8m,mode=1777

  production-check:
    <<: *app
    profiles: ["tools"]
    command: ["dist/cli/check-production-readiness.js"]
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  maintenance:
    <<: *app
    profiles: ["tools"]
    command: ["dist/cli/cleanup-operational-data.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

networks:
  private:
    driver: bridge

volumes:
  caddy-config:
  caddy-data:
  minio-data:
  postgres-data:
  redis-data:
