apiVersion: batch/v1
kind: Job
metadata:
  name: lingotrip-production-check-replace-with-release-id
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: lingotrip-production-check
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: production-check
          image: registry.example.com/lingotrip/backend:replace-with-digest
          args: ["dist/cli/check-production-readiness.js"]
          envFrom:
            - configMapRef:
                name: lingotrip-backend-config
            - secretRef:
                name: lingotrip-backend-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
