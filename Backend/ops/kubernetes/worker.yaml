apiVersion: apps/v1
kind: Deployment
metadata:
  name: lingotrip-worker
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: lingotrip-worker
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: lingotrip-worker
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: registry.example.com/lingotrip/backend:replace-with-digest
          imagePullPolicy: IfNotPresent
          args:
            [
              "--import",
              "./dist/instrumentation-loader.js",
              "--import",
              "./dist/instrumentation.js",
              "dist/worker.js",
            ]
          envFrom:
            - configMapRef:
                name: lingotrip-backend-config
            - secretRef:
                name: lingotrip-backend-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
