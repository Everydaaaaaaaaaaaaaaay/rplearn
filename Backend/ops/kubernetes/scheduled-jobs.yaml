apiVersion: batch/v1
kind: CronJob
metadata:
  name: lingotrip-apple-billing-reconcile
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  schedule: "*/15 * * * *"
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  timeZone: Etc/UTC
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: lingotrip-apple-billing-reconcile
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reconcile
              image: registry.example.com/lingotrip/backend:replace-with-digest
              args: ["dist/cli/reconcile-apple-billing.js"]
              envFrom:
                - configMapRef:
                    name: lingotrip-backend-config
                - secretRef:
                    name: lingotrip-backend-secrets
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: lingotrip-operational-cleanup
spec:
  concurrencyPolicy: Forbid
