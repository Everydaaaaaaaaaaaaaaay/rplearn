apiVersion: batch/v1
kind: Job
metadata:
  name: lingotrip-migrate-replace-with-release-id
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: registry.example.com/lingotrip/backend:replace-with-digest
          args: ["dist/cli/migrate.js"]
          env:
            - name: NODE_ENV
              value: production
            - name: MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: database-url
                  name: lingotrip-migration-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
