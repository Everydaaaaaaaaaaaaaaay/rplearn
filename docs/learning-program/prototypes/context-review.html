<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>咕游记 · 语境复习原型</title>
  <style>
    :root {
      font:
        16px/1.5 -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      color: #21394b;
      background: #ecede6;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
    }
    button {
      font: inherit;
      cursor: pointer;
      touch-action: manipulation;
    }
    button:disabled {
      opacity: 0.45;
      cursor: default;
    }
    button:focus-visible {
      outline: 3px solid #258592;
      outline-offset: 4px;
    }
    .workspace {
      max-width: 1050px;
      margin: auto;
      padding: 32px;
      display: grid;
      grid-template-columns: 1fr 420px;
      gap: 65px;
      align-items: start;
    }
    .brief {
      padding-top: 54px;
    }
    .eyebrow {
      font-size: 12px;
      letter-spacing: 0.1em;
      color: #647b7b;
      font-weight: 600;
    }
    h1 {
      font-size: 34px;
      line-height: 1.2;
      letter-spacing: -0.04em;
      max-width: 450px;
    }
    p {
      color: #65736f;
    }
    .note {
      font-size: 13px;
      max-width: 420px;
    }
    .phone {
      min-height: 790px;
      background: #f8f7f0;
      border-radius: 36px;
      border: 1px solid #d5dcd6;
      box-shadow: 0 18px 50px #223c4914;
      overflow: hidden;
      position: relative;
    }
    .top {
      padding: 24px 24px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .top strong {
      font-size: 14px;
    }
    .quiet {
      border: 0;
      background: transparent;
      color: #426975;
      padding: 10px;
      border-radius: 12px;
    }
    .main {
      padding: 8px 26px 28px;
    }
    h2 {
      font-size: 28px;
      letter-spacing: -0.035em;
      line-height: 1.3;
      margin: 18px 0 10px;
    }
    .caption {
      font-size: 13px;
      color: #65766f;
    }
    .panel {
      background: white;
      border: 1px solid #dfe4de;
      border-radius: 23px;
      padding: 24px;
      margin: 24px 0;
    }
    .primary {
      width: 100%;
      border: 0;
      border-radius: 17px;
      background: #284b59;
      color: white;
      padding: 15px;
      font-weight: 600;
      min-height: 50px;
    }
    .secondary {
      background: #e8eeea;
      color: #294e5b;
    }
    .mode {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 26px 0;
    }
    .mode button {
      border: 1px solid #c8d4ce;
      background: transparent;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
    }
    .mode button[aria-pressed="true"] {
      background: #294e5b;
      color: white;
    }
    .section-title {
      font-size: 13px;
      color: #576e67;
      font-weight: 600;
    }
    .word {
      font-size: 38px;
      font-weight: 650;
      letter-spacing: -0.03em;
      margin: 34px 0 6px;
    }
    .phonetic {
      font-size: 14px;
      color: #7c8985;
    }
    .context {
      padding: 18px 0;
      border-top: 1px solid #edf0eb;
      margin-top: 22px;
    }
    .quote {
      font-size: 17px;
      color: #395660;
      line-height: 1.7;
      margin: 10px 0;
    }
    .meaning {
      font-size: 21px;
      font-weight: 600;
      margin: 20px 0 12px;
    }
    .source {
      font-size: 12px;
      color: #657e78;
    }
    .ratings {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 22px;
    }
    .ratings button {
      border: 1px solid #d8ded6;
      background: #f5f4ec;
      border-radius: 15px;
      min-height: 75px;
      padding: 12px 4px;
      color: #294653;
      font-weight: 600;
    }
    .ratings button:nth-child(1) {
      background: #f3e9df;
    }
    .ratings button:nth-child(3) {
      background: #e4eee6;
    }
    .ratings small {
      display: block;
      font-size: 10px;
      font-weight: 400;
      margin-top: 3px;
      color: #66736b;
    }
    progress {
      width: 100%;
      height: 5px;
      accent-color: #58968c;
    }
    .bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
      font-size: 13px;
    }
    .metric {
      display: flex;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid #eef0eb;
    }
    .metric b {
      font-variant-numeric: tabular-nums;
    }
    .empty {
      padding: 12px 0;
    }
    .notice {
      min-height: 24px;
      font-size: 13px;
      color: #586e65;
      margin-top: 12px;
    }
    .preview-label {
      font-size: 11px;
      text-align: center;
      color: #849089;
      padding: 15px;
      border-top: 1px solid #e1e7df;
    }
    .subtle {
      font-size: 12px;
    }
    .choices {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    .choices button {
      flex: 1;
    }
    .brief ul {
      padding-left: 20px;
      color: #65736f;
      font-size: 14px;
    }
    .brief li {
      margin: 12px 0;
    }
    @media (max-width: 800px) {
      .workspace {
        display: block;
        padding: 16px;
      }
      .brief {
        padding: 0 8px;
      }
      .brief h1 {
        font-size: 24px;
      }
      .brief ul,
      .brief .note {
        display: none;
      }
      .phone {
        max-width: 440px;
        margin: 24px auto;
        min-height: 740px;
      }
    }
    @media (prefers-reduced-motion: no-preference) {
      button {
        transition:
          background 0.15s,
          transform 0.15s;
      }
      button:active {
        transform: scale(0.98);
      }
    }
  </style>
  <div class="workspace">
    <aside class="brief">
      <div class="eyebrow">LINGOTRIP · 任务原型 B-003</div>
      <h1>把聊过的话，<br />变成记得住的表达。</h1>
      <p>比较两个入口，使用同一套短复习。</p>
      <div class="mode" aria-label="入口比较">
        <button id="hub" aria-pressed="true">独立学习页</button
        ><button id="saved" aria-pressed="false">收藏内回看</button>
      </div>
      <ul>
        <li>先回忆，再看释义；原句作为可选提示。</li>
        <li>评分可以撤销；随时结束，不催促补完。</li>
        <li>自评与“已经掌握”分开，不做虚假水平统计。</li>
      </ul>
      <p class="note">
        预置的虚拟对话材料，仅用于比较任务流程。当前不是最终视觉稿；没有账号写入、网络请求或复习排程。后续需原生高保真及真人任务验证。
      </p>
    </aside>
    <section class="phone" aria-label="复习原型">
      <header class="top">
        <strong>咕游记</strong
        ><button class="quiet" id="restart">重新体验</button>
      </header>
      <main class="main" id="app"></main>
      <div class="preview-label">交互原型 · 预置内容 · 不记录至账号</div>
    </section>
  </div>
  <script>
    "use strict";
    const cards = [
      {
        id: "cosy",
        word: "cosy",
        phonetic: "/ˈkəʊzi/",
        meaning: "温暖舒适的",
        speaker: "你 · 与 Ruby 的聊天",
        text: "A cosy café, a good book, and absolutely no alarm clocks.",
        zh: "一家温暖舒适的咖啡馆，一本好书，而且绝对不要闹钟。",
      },
      {
        id: "unwind",
        word: "unwind",
        phonetic: "/ʌnˈwaɪnd/",
        meaning: "放松；松弛下来",
        speaker: "Ruby · 聊天",
        text: "What's your perfect way to unwind after a busy day?",
        zh: "忙碌一天之后，你最喜欢怎样放松？",
      },
      {
        id: "highlight",
        word: "highlight",
        phonetic: "/ˈhaɪlaɪt/",
        meaning: "最精彩的部分；亮点",
        speaker: "你 · 与 Marcus 的聊天",
        text: "What's been the highlight of your day?",
        zh: "你今天最精彩的时刻是什么？",
      },
    ];
    const app = document.getElementById("app");
    let mode = "hub",
      stage = "home",
      revealed = false,
      hinted = false,
      hintUsed = false,
      events = [],
      activeMS = 0,
      tick = performance.now(),
      visible = !document.hidden;
    function elapsed() {
      const now = performance.now();
      if (stage === "review" && visible) activeMS += Math.max(0, now - tick);
      tick = now;
    }
    document.addEventListener("visibilitychange", () => {
      elapsed();
      visible = !document.hidden;
    });
    function setStage(next) {
      elapsed();
      stage = next;
      tick = performance.now();
      render();
    }
    function button(id, label, cls = "primary") {
      return `<button id="${id}" class="${cls}">${label}</button>`;
    }
    function wire(id, fn) {
      document.getElementById(id)?.addEventListener("click", fn);
    }
    function reset() {
      stage = "home";
      events = [];
      revealed = false;
      hinted = false;
      hintUsed = false;
      activeMS = 0;
      tick = performance.now();
      render();
    }
    function render() {
      const c = cards[events.length];
      if (stage === "home") {
        app.innerHTML = `<div class="eyebrow">${mode === "hub" ? "YOUR PRACTICE" : "YOUR COLLECTION"}</div><h2>${mode === "hub" ? "从聊过的词开始" : "收藏夹"}</h2><p class="caption">${mode === "hub" ? "给自己一小段专注时间。" : "喜欢的词，也可以拿出来练一练。"}</p><div class="panel"><div class="section-title">${mode === "hub" ? "今天的短复习" : "已选 3 个单词"}</div><h2>3 个词 · 一小组</h2><p class="caption">来自你与旅伴聊过的话</p><p class="quote">cosy · unwind · highlight</p>${button("start", "开始回忆")}</div><p class="subtle">不用一次做完，随时可以结束。</p>`;
        wire("start", () => setStage("review"));
        return;
      }
      if (stage === "review") {
        app.innerHTML = `<div class="bottom"><span>已回顾 ${events.length} / ${cards.length}</span>${button("end", "结束", "quiet")}</div><progress value="${events.length}" max="3" aria-label="已回顾单词"></progress><div class="word">${c.word}</div><div class="phonetic">${c.phonetic}</div><p class="caption">先试着想想，它是什么意思？</p><div class="panel">${revealed ? `<div class="section-title">词义</div><div class="meaning">${c.meaning}</div>` : `<p class="caption">回忆后再看答案，不确定也没关系。</p>${button("reveal", "看看释义")}`}<div class="context">${button("hint", hinted ? "收起原句" : "看看当时的原句", "quiet")}${hinted ? `<div class="source">${c.speaker}</div><p class="quote">${c.text}</p>${revealed ? `<p class="caption">${c.zh}</p>` : ""}` : ""}</div></div>${revealed ? `<div class="section-title">刚才回忆得怎么样？</div><div class="ratings"><button id="forgot">忘记<small>没想起来</small></button><button id="fuzzy">模糊<small>不太确定</small></button><button id="remembered">记得<small>清楚想起来了</small></button></div>` : ""}<div class="bottom">${button("undo", "撤销上一词", "quiet")}<span class="caption">自评不等于掌握</span></div>`;
        wire("reveal", () => {
          revealed = true;
          render();
        });
        wire("hint", () => {
          hinted = !hinted;
          hintUsed = true;
          render();
        });
        wire("end", () => setStage("summary"));
        wire("undo", undo);
        document.getElementById("undo").disabled = events.length === 0;
        for (const rating of ["forgot", "fuzzy", "remembered"])
          wire(rating, () => {
            elapsed();
            events.push({ id: c.id, rating, hinted: hintUsed });
            revealed = false;
            hinted = false;
            hintUsed = false;
            if (events.length === cards.length) setStage("summary");
            else render();
          });
        return;
      }
      const counts = Object.fromEntries(
        ["forgot", "fuzzy", "remembered"].map((r) => [
          r,
          events.filter((e) => e.rating === r).length,
        ]),
      );
      app.innerHTML = `<div class="eyebrow">SESSION COMPLETE</div><h2>${events.length ? "这次先到这里。" : "这次先歇一歇。"}</h2><p class="caption">${events.length ? "看看这次的回忆情况，下次再接着练。" : "还没有完成自评，不计为已学习。"}</p><div class="panel"><div class="metric"><span>本次回顾</span><b>${new Set(events.map((e) => e.id)).size} 个词</b></div><div class="metric"><span>记得 / 模糊 / 忘记</span><b>${counts.remembered} / ${counts.fuzzy} / ${counts.forgot}</b></div><div class="metric"><span>前台停留</span><b>${Math.floor(activeMS / 1000)} 秒</b></div><p class="caption">这是本次自评记录，不代表已掌握词汇量。停留时间不代表有效学习时长。原型未安排下次复习。</p></div>${events.length < cards.length ? button("resumeReview", "继续剩下的词") : ""}${button("done", mode === "hub" ? "回到学习页" : "回到收藏夹", "quiet")}<div class="bottom">${button("undo", "撤销上一词", "quiet")}</div>`;
      wire("resumeReview", () => setStage("review"));
      wire("done", reset);
      wire("undo", undo);
      document.getElementById("undo").disabled = !events.length;
    }
    function undo() {
      if (!events.length) return;
      events.pop();
      revealed = false;
      hinted = false;
      hintUsed = false;
      setStage("review");
    }
    for (const id of ["hub", "saved"])
      document.getElementById(id).onclick = () => {
        mode = id;
        for (const other of ["hub", "saved"])
          document
            .getElementById(other)
            .setAttribute("aria-pressed", String(other === mode));
        reset();
      };
    document.getElementById("restart").onclick = reset;
    render();
  </script>
</html>
