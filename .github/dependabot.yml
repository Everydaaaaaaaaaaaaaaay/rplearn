version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - security
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /Backend
    schedule:
      interval: weekly
    labels:
      - backend
      - dependencies
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /Backend
    schedule:
      interval: weekly
    labels:
      - backend
      - dependencies
      - security
    open-pull-requests-limit: 5
