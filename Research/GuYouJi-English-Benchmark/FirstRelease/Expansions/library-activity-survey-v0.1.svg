<text x="346" y="262.0" text-anchor="middle" font-size="18">30%</text>
<text x="346" y="377" text-anchor="middle" font-size="18">3</text>
<rect x="423" y="207.0" width="58" height="143.0" fill="#426b9c"/>
<text x="452" y="197.0" text-anchor="middle" font-size="18">55%</text>
<text x="452" y="377" text-anchor="middle" font-size="18">4</text>
