<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img" aria-labelledby="title desc">
<title id="title">Library Activity Survey</title>
<desc id="desc">40 Grade Eight students could choose several different activities, each activity only once. Vertical axis: Students, zero to forty in steps of ten. Horizontal axis: Activity number. Percentages for activities one to six: 65%, 45%, 30%, 55%, 20%, 40%. Each percentage uses all forty students as its denominator. Activity names appear in the numbered list accompanying the chart.</desc>
<rect width="800" height="440" fill="#ffffff"/>
<g font-family="Arial, sans-serif" fill="#172033">
<text x="400" y="32" font-size="23" text-anchor="middle">Library Activity Survey</text>
<text x="25" y="200" font-size="17" transform="rotate(-90 25 200)" text-anchor="middle">Students</text>
<path d="M70 350.0 H760" stroke="#d6dce4" stroke-width="1"/>
<text x="58" y="356.0" font-size="16" text-anchor="end">0</text>
<path d="M70 285.0 H760" stroke="#d6dce4" stroke-width="1"/>
<text x="58" y="291.0" font-size="16" text-anchor="end">10</text>
<path d="M70 220.0 H760" stroke="#d6dce4" stroke-width="1"/>
<text x="58" y="226.0" font-size="16" text-anchor="end">20</text>
<path d="M70 155.0 H760" stroke="#d6dce4" stroke-width="1"/>
<text x="58" y="161.0" font-size="16" text-anchor="end">30</text>
<path d="M70 90.0 H760" stroke="#d6dce4" stroke-width="1"/>
<text x="58" y="96.0" font-size="16" text-anchor="end">40</text>
<rect x="105" y="181.0" width="58" height="169.0" fill="#426b9c"/>
<text x="134" y="171.0" text-anchor="middle" font-size="18">65%</text>
<text x="134" y="377" text-anchor="middle" font-size="18">1</text>
<rect x="211" y="233.0" width="58" height="117.0" fill="#426b9c"/>
<text x="240" y="223.0" text-anchor="middle" font-size="18">45%</text>
<text x="240" y="377" text-anchor="middle" font-size="18">2</text>
