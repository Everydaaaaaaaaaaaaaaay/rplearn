<svg xmlns="http://www.w3.org/2000/svg" width="760" height="180" viewBox="0 0 760 180" role="img" aria-labelledby="title desc">
  <title id="title">Steps for preparing books for a reading room</title>
  <desc id="desc">Check books, repair them, try using them, then return them. The arrows show the order.</desc>
  <rect width="760" height="180" fill="white"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#263747"/></marker></defs>
  <g fill="#f3f6f8" stroke="#263747" stroke-width="2">
    <rect x="20" y="50" width="140" height="65" rx="8"/>
    <rect x="210" y="50" width="140" height="65" rx="8"/>
    <rect x="400" y="50" width="140" height="65" rx="8"/>
    <rect x="590" y="50" width="140" height="65" rx="8"/>
  </g>
  <g fill="#152839" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">
    <text x="90" y="90">Check books</text>
    <text x="280" y="90">Repair</text>
    <text x="470" y="90">Try using them</text>
    <text x="660" y="90">Return books</text>
  </g>
  <g stroke="#263747" stroke-width="2.5" marker-end="url(#arrow)">
    <line x1="165" y1="82" x2="200" y2="82"/>
    <line x1="355" y1="82" x2="390" y2="82"/>
    <line x1="545" y1="82" x2="580" y2="82"/>
  </g>
  <text x="380" y="150" fill="#263747" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">The arrows show the order.</text>
</svg>
