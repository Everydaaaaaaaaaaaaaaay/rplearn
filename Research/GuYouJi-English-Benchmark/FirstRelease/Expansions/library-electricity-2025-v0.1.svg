<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
  <title id="title">Library electricity use in 2025</title>
  <desc id="desc">Shares of the library's annual electricity use: reading rooms 30.1%, computer rooms 24.4%, storage rooms 17.6%, café 14.6%, entrance 8.0%, outside areas 5.3%. Study use groups reading and computer rooms, totalling 54.5%.</desc>
  <defs>
    <pattern id="lines" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M0 0L7 7M-1 6L1 8M6-1L8 1" stroke="#59636f" stroke-width="1"/></pattern>
  </defs>
  <rect width="900" height="320" fill="white"/>
  <g font-family="Arial, sans-serif" fill="#17202a">
    <text x="30" y="34" font-size="22" font-weight="bold">Library electricity use · 2025</text>
    <text x="30" y="59" font-size="15">Percentage of this library's total annual electricity use</text>
    <path d="M30 99V84H487.8V99" fill="none" stroke="#17202a" stroke-width="2"/>
    <text x="258.9" y="80" text-anchor="middle" font-size="15" font-weight="bold">STUDY USE</text>
    <g stroke="#17202a" stroke-width="1.5">
      <rect x="30" y="105" width="252.84" height="52" fill="#d9e0e6"/>
      <rect x="282.84" y="105" width="204.96" height="52" fill="url(#lines)"/>
      <rect x="487.8" y="105" width="147.84" height="52" fill="#b7c1cb"/>
      <rect x="635.64" y="105" width="122.64" height="52" fill="#edf0f3"/>
      <rect x="758.28" y="105" width="67.2" height="52" fill="#7d8b99"/>
      <rect x="825.48" y="105" width="44.52" height="52" fill="#17202a"/>
    </g>
    <text x="30" y="194" font-size="17">Reading rooms: 30.1%</text>
    <text x="330" y="194" font-size="17">Computer rooms: 24.4%</text>
    <text x="630" y="194" font-size="17">Storage rooms: 17.6%</text>
    <text x="30" y="228" font-size="17">Café: 14.6%</text>
    <text x="330" y="228" font-size="17">Entrance: 8.0%</text>
    <text x="630" y="228" font-size="17">Outside areas: 5.3%</text>
    <text x="30" y="268" font-size="15">Left-to-right order follows the labels above; all six shares total 100.0%.</text>
    <text x="30" y="295" font-size="14">Data describe an imagined university library.</text>
  </g>
</svg>
