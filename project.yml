name: LingoTrip
packages:
  LingoKit:
    path: Packages/LingoKit
schemes:
  LingoTrip:
    build:
      targets:
        LingoTrip: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - LingoTripTests
targets:
  LingoTrip:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - App
    dependencies:
      - package: LingoKit
        product: CoreKit
      - package: LingoKit
        product: LLMKit
      - package: LingoKit
        product: DictKit
      - package: LingoKit
        product: PersistenceKit
      - package: LingoKit
        product: DomainKit
      - package: LingoKit
        product: SpeechKit
      - package: LingoKit
        product: HomeFeature
      - package: LingoKit
        product: ChatFeature
      - package: LingoKit
        product: OnboardingFeature
      - package: LingoKit
        product: StoryFeature
      - package: LingoKit
        product: RosterFeature
      - package: LingoKit
        product: MapFeature
      - package: LingoKit
        product: FavoritesFeature
      - package: LingoKit
        product: SettingsFeature
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingotrip.app
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: build/Generated-Info.plist
      properties:
        NSMicrophoneUsageDescription: "用于录制语音消息，练习英语口语"
        NSSpeechRecognitionUsageDescription: "用于将你的语音转换为文字发送给 AI 角色"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

  # App 托管的测试 bundle：钥匙串/SwiftData 等依赖 App 环境的测试必须有宿主。
  # 测试源码仍位于 package 的 Tests/ 目录下，按被测模块分子目录。
  LingoTripTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Packages/LingoKit/Tests
    dependencies:
      - target: LingoTrip
      - package: LingoKit
        product: CoreKit
      - package: LingoKit
        product: LLMKit
      - package: LingoKit
        product: DictKit
      - package: LingoKit
        product: PersistenceKit
      - package: LingoKit
        product: DomainKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingotrip.app.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
