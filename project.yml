name: LingoTrip
packages:
  LingoKit:
    path: Packages/LingoKit
schemes:
  LingoTrip:
    build:
      targets:
        LingoTrip: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - LingoTripTests
targets:
  LingoTrip:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    configFiles:
      Debug: Config/Signing.Debug.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - App
    dependencies:
      - package: LingoKit
        product: CoreKit
      - package: LingoKit
        product: BackendKit
      - package: LingoKit
        product: BillingKit
      - package: LingoKit
        product: SyncKit
      - package: LingoKit
        product: AuthFeature
      - package: LingoKit
        product: DesignSystem
      - package: LingoKit
        product: LLMKit
      - package: LingoKit
        product: DictKit
      - package: LingoKit
        product: PersistenceKit
      - package: LingoKit
        product: DomainKit
      - package: LingoKit
        product: SpeechKit
      - package: LingoKit
        product: MediaKit
      - package: LingoKit
        product: HomeFeature
      - package: LingoKit
        product: ChatFeature
      - package: LingoKit
        product: OnboardingFeature
      - package: LingoKit
        product: StoryFeature
      - package: LingoKit
        product: RosterFeature
      - package: LingoKit
        product: MapFeature
      - package: LingoKit
        product: FavoritesFeature
      - package: LingoKit
        product: SettingsFeature
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LINGOTRIP_BUNDLE_ID)
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: App/LingoTrip.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        VERSIONING_SYSTEM: apple-generic
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: build/Generated-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "用于录制语音消息，练习英语口语"
        NSSpeechRecognitionUsageDescription: "用于将你的语音转换为文字发送给 AI 角色"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  # App 托管的测试 bundle：钥匙串/SwiftData 等依赖 App 环境的测试必须有宿主。
  # 测试源码仍位于 package 的 Tests/ 目录下，按被测模块分子目录。
  LingoTripTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    configFiles:
      Debug: Config/Signing.Debug.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - Packages/LingoKit/Tests
    dependencies:
      - target: LingoTrip
      - package: LingoKit
        product: CoreKit
      - package: LingoKit
        product: BackendKit
      - package: LingoKit
        product: BillingKit
      - package: LingoKit
        product: SyncKit
      - package: LingoKit
        product: LLMKit
      - package: LingoKit
        product: DictKit
      - package: LingoKit
        product: PersistenceKit
      - package: LingoKit
        product: DomainKit
      - package: LingoKit
        product: SpeechKit
      - package: LingoKit
        product: MediaKit
      - package: LingoKit
        product: ChatFeature
      - package: LingoKit
        product: HomeFeature
      - package: LingoKit
        product: StoryEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LINGOTRIP_BUNDLE_ID).tests
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
