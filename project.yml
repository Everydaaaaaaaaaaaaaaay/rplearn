name: LingoTrip
packages:
  LingoKit:
    path: Packages/LingoKit
schemes:
  LingoTrip:
    build:
      targets:
        LingoTrip: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - LingoTripTests
  LingoTripConversationTests:
    build:
      targets:
        LingoTripConversationTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - LingoTripConversationTests
targets:
  LingoTrip:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    preBuildScripts:
      - name: Verify Bundled Voice Models
        script: '"$SRCROOT/Scripts/verify-bundled-voice-models.sh" "$DERIVED_FILE_DIR/bundled-voice-models.verified"'
        basedOnDependencyAnalysis: false
    configFiles:
      Debug: Config/Signing.Debug.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - App
    dependencies:
      - package: LingoKit
        product: CoreKit
      - package: LingoKit
        product: BackendKit
      - package: LingoKit
        product: BillingKit
      - package: LingoKit
        product: SyncKit
      - package: LingoKit
        product: AuthFeature
      - package: LingoKit
        product: DesignSystem
      - package: LingoKit
        product: MascotKit
      - package: LingoKit
        product: LLMKit
      - package: LingoKit
        product: DictKit
      - package: LingoKit
        product: PersistenceKit
      - package: LingoKit
        product: DomainKit
      - package: LingoKit
        product: SpeechKit
      - package: LingoKit
        product: RealtimeVoiceKit
      - package: LingoKit
        product: MediaKit
      - package: LingoKit
        product: HomeFeature
      - package: LingoKit
        product: ChatFeature
      - package: LingoKit
        product: OnboardingFeature
      - package: LingoKit
        product: PlacementFeature
      - package: LingoKit
        product: StoryFeature
      - package: LingoKit
        product: RosterFeature
      - package: LingoKit
        product: MapFeature
      - package: LingoKit
        product: FavoritesFeature
      - package: LingoKit
        product: SettingsFeature
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LINGOTRIP_BUNDLE_ID)
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_STYLE[sdk=iphonesimulator*]": Manual
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        "DEVELOPMENT_TEAM[sdk=iphonesimulator*]": ""
        "PROVISIONING_PROFILE_SPECIFIER[sdk=iphonesimulator*]": ""
        CODE_SIGN_ENTITLEMENTS: App/LingoTrip.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        VERSIONING_SYSTEM: apple-generic
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: build/Generated-Info.plist
      properties:
        CFBundleDisplayName: "咕游记"
        CFBundleName: "Coovingo"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "用于录制语音消息和进行实时英语对话"
        NSSpeechRecognitionUsageDescription: "用于将实时英语对话转换为文字发送给 AI 角色"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen:
          UIColorName: BrandLaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  # App 托管的测试 bundle：钥匙串/SwiftData 等依赖 App 环境的测试必须有宿主。
  # 测试源码仍位于 package 的 Tests/ 目录下，按被测模块分子目录。
  LingoTripTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    configFiles:
      Debug: Config/Signing.Debug.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - Packages/LingoKit/Tests
    dependencies:
      - target: LingoTrip
      - package: LingoKit
        product: CoreKit
      - package: LingoKit
        product: BackendKit
      - package: LingoKit
        product: BillingKit
      - package: LingoKit
        product: SyncKit
      - package: LingoKit
        product: LLMKit
      - package: LingoKit
        product: DictKit
      - package: LingoKit
        product: PersistenceKit
      - package: LingoKit
        product: DomainKit
      - package: LingoKit
        product: SpeechKit
      - package: LingoKit
        product: RealtimeVoiceKit
      - package: LingoKit
        product: MediaKit
      - package: LingoKit
        product: MascotKit
      - package: LingoKit
        product: DesignSystem
      - package: LingoKit
        product: ChatFeature
      - package: LingoKit
        product: HomeFeature
      - package: LingoKit
        product: OnboardingFeature
      - package: LingoKit
        product: PlacementFeature
      - package: LingoKit
        product: RosterFeature
      - package: LingoKit
        product: StoryEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LINGOTRIP_BUNDLE_ID).tests
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_STYLE[sdk=iphonesimulator*]": Manual
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        "DEVELOPMENT_TEAM[sdk=iphonesimulator*]": ""
        "PROVISIONING_PROFILE_SPECIFIER[sdk=iphonesimulator*]": ""
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

  # 不依赖宿主 App 与 SpeechKit，供高频对话逻辑改动快速回归。
  LingoTripConversationTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Packages/LingoKit/Tests
        includes:
          - DomainKitTests/PromptBuilderTests.swift
          - DomainKitTests/RoleplayReplyFormatterTests.swift
          - DomainKitTests/ProactiveMessageSchedulePolicyTests.swift
    dependencies:
      - package: LingoKit
        product: DomainKit
      - package: LingoKit
        product: PersistenceKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LINGOTRIP_BUNDLE_ID).conversationtests
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_STYLE[sdk=iphonesimulator*]": Manual
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        "DEVELOPMENT_TEAM[sdk=iphonesimulator*]": ""
        "PROVISIONING_PROFILE_SPECIFIER[sdk=iphonesimulator*]": ""
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
